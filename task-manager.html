<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .input-section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .priority-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .priority-btn {
            padding: 8px 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .priority-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .priority-btn.high.active {
            background: #f44336;
            border-color: #f44336;
        }

        .priority-btn.medium.active {
            background: #ff9800;
            border-color: #ff9800;
        }

        #addBtn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
            width: 100%;
        }

        #addBtn:hover {
            transform: translateY(-2px);
        }

        .tasks-section {
            padding: 30px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .task-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            border-left: 4px solid #4CAF50;
        }

        .task-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .task-item.high {
            border-left-color: #f44336;
        }

        .task-item.medium {
            border-left-color: #ff9800;
        }

        .task-item.low {
            border-left-color: #4CAF50;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
        }

        .task-priority {
            background: #e0e0e0;
            color: #666;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .task-priority.high {
            background: #ffebee;
            color: #f44336;
        }

        .task-priority.medium {
            background: #fff3e0;
            color: #ff9800;
        }

        .task-priority.low {
            background: #e8f5e8;
            color: #4CAF50;
        }

        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 50px 20px;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Stats -->
        <div class="header">
            <h1>📝 My Task Manager</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="What needs to be done today?" maxlength="100">
            </div>
            
            <div class="priority-selector">
                <span>Priority:</span>
                <button class="priority-btn low active" data-priority="low">Low</button>
                <button class="priority-btn medium" data-priority="medium">Medium</button>
                <button class="priority-btn high" data-priority="high">High</button>
            </div>
            
            <button id="addBtn">Add Task</button>
        </div>

        <!-- Filter Section -->
        <div class="tasks-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Tasks</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Tasks Container -->
            <div id="tasksContainer">
                <div class="empty-state">
                    <h3>No tasks yet!</h3>
                    <p>Add your first task above to get started</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CLASS 1: Basic JavaScript & DOM Manipulation
        // ==========================================
        
        // Variables to store our data and elements
        let tasks = [];
        let currentFilter = 'all';
        let selectedPriority = 'low';
        
        // Get references to HTML elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const tasksContainer = document.getElementById('tasksContainer');
        const totalTasksElement = document.getElementById('totalTasks');
        const completedTasksElement = document.getElementById('completedTasks');
        const pendingTasksElement = document.getElementById('pendingTasks');
        
        // Priority buttons
        const priorityButtons = document.querySelectorAll('.priority-btn');
        const filterButtons = document.querySelectorAll('.filter-btn');

        // ==========================================
        // CLASS 1: Basic Event Listeners
        // ==========================================
        
        // Add task when button is clicked
        addBtn.addEventListener('click', function() {
            addTask();
        });
        
        // Add task when Enter key is pressed
        taskInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        });

        // Priority selection
        priorityButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all buttons
                priorityButtons.forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                // Store selected priority
                selectedPriority = this.getAttribute('data-priority');
            });
        });

        // ==========================================
        // CLASS 1: Basic Functions
        // ==========================================
        
        // Function to add a new task
        function addTask() {
            // Get the text from input
            const taskText = taskInput.value.trim();
            
            // Check if input is not empty
            if (taskText === '') {
                alert('Please enter a task!');
                return;
            }
            
            // Create a new task object
            const newTask = {
                id: Date.now(), // Simple ID using timestamp
                text: taskText,
                completed: false,
                priority: selectedPriority,
                createdAt: new Date()
            };
            
            // Add task to our array
            tasks.push(newTask);
            
            // Clear the input
            taskInput.value = '';
            
            // Update the display
            displayTasks();
            updateStats();
            
            console.log('Task added:', newTask);
        }

        // ==========================================
        // CLASS 2: Advanced Functions & Control Flow
        // ==========================================
        
        // Function to display all tasks
        function displayTasks() {
            // Clear the container
            tasksContainer.innerHTML = '';
            
            // Filter tasks based on current filter
            let filteredTasks = tasks;
            
            if (currentFilter === 'pending') {
                filteredTasks = tasks.filter(task => !task.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(task => task.completed);
            }
            
            // Check if there are no tasks to show
            if (filteredTasks.length === 0) {
                showEmptyState();
                return;
            }
            
            // Sort tasks: incomplete first, then by priority
            filteredTasks.sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed - b.completed;
                }
                const priorityOrder = { high: 3, medium: 2, low: 1 };
                return priorityOrder[b.priority] - priorityOrder[a.priority];
            });
            
            // Create HTML for each task
            filteredTasks.forEach(task => {
                const taskElement = createTaskElement(task);
                tasksContainer.appendChild(taskElement);
            });
        }
        
        // Function to create HTML element for a task
        function createTaskElement(task) {
            // Create the main task container
            const taskDiv = document.createElement('div');
            taskDiv.className = `task-item ${task.priority}`;
            if (task.completed) {
                taskDiv.classList.add('completed');
            }
            
            // Create checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', function() {
                toggleTask(task.id);
            });
            
            // Create task text
            const taskText = document.createElement('span');
            taskText.className = 'task-text';
            taskText.textContent = task.text;
            
            // Create priority badge
            const priorityBadge = document.createElement('span');
            priorityBadge.className = `task-priority ${task.priority}`;
            priorityBadge.textContent = task.priority;
            
            // Create delete button
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', function() {
                deleteTask(task.id);
            });
            
            // Assemble the task element
            taskDiv.appendChild(checkbox);
            taskDiv.appendChild(taskText);
            taskDiv.appendChild(priorityBadge);
            taskDiv.appendChild(deleteBtn);
            
            return taskDiv;
        }
        
        // Function to toggle task completion
        function toggleTask(taskId) {
            // Find the task in our array
            for (let i = 0; i < tasks.length; i++) {
                if (tasks[i].id === taskId) {
                    tasks[i].completed = !tasks[i].completed;
                    break;
                }
            }
            
            // Update display
            displayTasks();
            updateStats();
        }
        
        // Function to delete a task
        function deleteTask(taskId) {
            // Confirm before deleting
            if (confirm('Are you sure you want to delete this task?')) {
                // Remove task from array
                tasks = tasks.filter(task => task.id !== taskId);
                
                // Update display
                displayTasks();
                updateStats();
            }
        }
        
        // Function to show empty state
        function showEmptyState() {
            const emptyStateHtml = `
                <div class="empty-state">
                    <h3>${getEmptyStateMessage()}</h3>
                    <p>${getEmptyStateSubtext()}</p>
                </div>
            `;
            tasksContainer.innerHTML = emptyStateHtml;
        }
        
        // Function to get appropriate empty state message
        function getEmptyStateMessage() {
            if (currentFilter === 'completed') {
                return 'No completed tasks yet!';
            } else if (currentFilter === 'pending') {
                return 'No pending tasks!';
            } else {
                return 'No tasks yet!';
            }
        }
        
        // Function to get appropriate empty state subtext
        function getEmptyStateSubtext() {
            if (currentFilter === 'completed') {
                return 'Complete some tasks to see them here';
            } else if (currentFilter === 'pending') {
                return 'All tasks are completed! Great job!';
            } else {
                return 'Add your first task above to get started';
            }
        }
        
        // Function to update statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            const pending = total - completed;
            
            totalTasksElement.textContent = total;
            completedTasksElement.textContent = completed;
            pendingTasksElement.textContent = pending;
        }
        
        // ==========================================
        // CLASS 2: Filter Functionality
        // ==========================================
        
        // Add event listeners to filter buttons
        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                // Remove active class from all filter buttons
                filterButtons.forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                
                // Update current filter
                currentFilter = this.getAttribute('data-filter');
                
                // Update display
                displayTasks();
            });
        });
        
        // ==========================================
        // Initialize the app
        // ==========================================
        
        // Add some sample tasks for demonstration
        function initializeApp() {
            // Sample tasks for demo
            const sampleTasks = [
                { id: 1, text: 'Learn JavaScript basics', completed: false, priority: 'high', createdAt: new Date() },
                { id: 2, text: 'Practice DOM manipulation', completed: false, priority: 'medium', createdAt: new Date() },
                { id: 3, text: 'Build a todo app', completed: false, priority: 'low', createdAt: new Date() }
            ];
            
            // Uncomment the next line to start with sample tasks
            // tasks = sampleTasks;
            
            displayTasks();
            updateStats();
        }
        
        // Start the app when page loads
        initializeApp();
        
        // ==========================================
        // Bonus: Keyboard shortcuts (for advanced students)
        // ==========================================
        
        document.addEventListener('keydown', function(event) {
            // Press 'A' to focus on input
            if (event.key === 'a' && !event.target.matches('input')) {
                taskInput.focus();
                event.preventDefault();
            }
            
            // Press 'Escape' to clear input
            if (event.key === 'Escape') {
                taskInput.value = '';
                taskInput.blur();
            }
        });
        
        // Console messages for teaching
        console.log('🎉 Task Manager loaded successfully!');
        console.log('💡 Try adding some tasks and see how the JavaScript works');
        console.log('🔍 Check the tasks array:', tasks);
    </script>
</body>
</html>
